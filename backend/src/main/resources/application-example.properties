spring.application.name=IntelliMeet

# --- DATABASE CONFIGURATION ---
# Try to use DB_URL, but if it doesn't exist (like on your laptop), use the local MySQL database.
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/intellimeet_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

# This helps Java automatically create tables later
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- UPLOAD LIMITS ---
# INCREASE FILE UPLOAD LIMITS
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Increase API payload limits for Base64 Profile Images
server.tomcat.max-http-form-post-size=10MB

# --- EXTERNAL APIs ---
gemini.api.key=${GEMINI_API_KEY}
assemblyai.api.key=${ASSEMBLYAI_API_KEY}

# --- EMAIL SENDER CONFIGURATION ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- SERVER CONFIGURATION ---
server.port=8080